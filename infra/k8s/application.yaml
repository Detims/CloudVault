apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudvault-config
  namespace: cloudvault
data:
  FRONTEND_ORIGIN: http://localhost:30080
  CASSANDRA_CONTACT_POINTS: cloudvault-cassandra
  CASSANDRA_PORT: "9042"
  CASSANDRA_LOCAL_DATACENTER: datacenter1
  CASSANDRA_KEYSPACE: cloudvault
  AWS_REGION: us-west-2
  MAX_FILE_BYTES: "25000000"
  SESSION_COOKIE_SECURE: "false"
  AWS_SHARED_CREDENTIALS_FILE: /home/cloudvault/.aws/credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudvault-backend
  namespace: cloudvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudvault-backend
  template:
    metadata:
      labels:
        app: cloudvault-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-schema
          image: cassandra:5.0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              until cqlsh cloudvault-cassandra 9042 -e 'SELECT document_id FROM cloudvault.documents LIMIT 1' >/dev/null 2>&1; do
                echo 'Waiting for CloudVault Cassandra schema'; sleep 5;
              done
      containers:
        - name: backend
          image: cloudvault-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloudvault-config
          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudvault-app
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudvault-app
                  key: GOOGLE_CLIENT_SECRET
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: cloudvault-app
                  key: S3_BUCKET
          volumeMounts:
            - name: aws-credentials
              mountPath: /home/cloudvault/.aws
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: aws-credentials
          secret:
            secretName: cloudvault-aws
            optional: true
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: cloudvault-backend
  namespace: cloudvault
spec:
  type: ClusterIP
  selector:
    app: cloudvault-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudvault-frontend
  namespace: cloudvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudvault-frontend
  template:
    metadata:
      labels:
        app: cloudvault-frontend
    spec:
      containers:
        - name: frontend
          image: cloudvault-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloudvault-frontend
  namespace: cloudvault
spec:
  type: NodePort
  selector:
    app: cloudvault-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
