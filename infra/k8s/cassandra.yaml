apiVersion: v1
kind: Service
metadata:
  name: cloudvault-cassandra
  namespace: cloudvault
spec:
  clusterIP: None
  selector:
    app: cloudvault-cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloudvault-cassandra
  namespace: cloudvault
spec:
  serviceName: cloudvault-cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cloudvault-cassandra
  template:
    metadata:
      labels:
        app: cloudvault-cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:5.0
          ports:
            - name: cql
              containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: cloudvault-minikube
            - name: CASSANDRA_DC
              value: datacenter1
            - name: CASSANDRA_RACK
              value: rack1
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 128M
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            exec:
              command: ["bash", "-ec", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["bash", "-ec", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["bash", "-ec", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudvault-schema
  namespace: cloudvault
data:
  schema.cql: |
    CREATE KEYSPACE IF NOT EXISTS cloudvault
    WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};

    CREATE TABLE IF NOT EXISTS cloudvault.documents (
      owner_id text,
      document_id uuid,
      file_name text,
      content_type text,
      size_bytes bigint,
      object_key text,
      status text,
      created_at timestamp,
      PRIMARY KEY ((owner_id), document_id)
    ) WITH CLUSTERING ORDER BY (document_id DESC);
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudvault-cassandra-schema
  namespace: cloudvault
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-schema
          image: cassandra:5.0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              until cqlsh cloudvault-cassandra 9042 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1; do
                echo 'Waiting for Cassandra'; sleep 5;
              done
              cqlsh cloudvault-cassandra 9042 -f /schema/schema.cql
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: cloudvault-schema
